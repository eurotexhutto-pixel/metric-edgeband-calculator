<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Euro-Tex Metric Edgeband Roll Calculator</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0e8;font-family:Arial,sans-serif;color:#171717;min-height:100vh;display:flex;justify-content:center;padding:28px}.card{width:min(520px,100%);background:#f7f4eb;border:1px solid #ddd5c5;border-radius:12px;padding:24px;box-shadow:0 8px 25px #0002}.head{display:flex;gap:14px;align-items:center}.logo{width:54px;height:48px;border-radius:5px;background:#1c1c1c;color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center}.logo span{color:#c99b43}.brand{font-size:26px;font-weight:800}.sub{font-size:13px;letter-spacing:1.5px;margin-top:3px}.rule{height:2px;background:#aa843d;margin:16px 0 18px}.row{display:grid;grid-template-columns:1fr 135px;gap:18px;align-items:center;margin:14px 0}label{font-size:16px;font-weight:700}input{width:100%;padding:9px;font-size:19px;font-weight:700;text-align:center;border:1px solid #999;border-radius:6px;background:#fff}.result{margin-top:20px;background:#e1f0da;border:1px solid #7d9873;border-radius:8px;text-align:center;padding:12px}.rl{font-size:13px;font-weight:800}#feet{font-size:46px;font-weight:900}.note{text-align:center;color:#666;font-size:12px;font-style:italic;margin-top:12px}@media(max-width:420px){.row{grid-template-columns:1fr 110px}.brand{font-size:22px}.sub{font-size:11px}.card{padding:18px}}</style><script>function calc(){var D=parseFloat(document.getElementById("od").value),d=parseFloat(document.getElementById("core").value),t=parseFloat(document.getElementById("thick").value),o=document.getElementById("feet");if(isFinite(D)&&isFinite(d)&&isFinite(t)&&D>d&&d>=0&&t>0){var f=Math.PI*(D*D-d*d)/(4*t*304.8);o.textContent=Math.round(f)+" FT"}else{o.textContent="--- FT"}}window.addEventListener("DOMContentLoaded",calc);</script></head><body><main class="card"><div class="head"><div class="logo">E<span>T</span></div><div><div class="brand">EURO-TEX MFG.</div><div class="sub">METRIC EDGEBAND ROLL CALCULATOR</div></div></div><div class="rule"></div><div class="row"><label>Outside Diameter (mm)</label><input id="od" inputmode="decimal" value="279.4" oninput="calc()"></div><div class="row"><label>Core Diameter (mm)</label><input id="core" inputmode="decimal" value="120.65" oninput="calc()"></div><div class="row"><label>Tape Thickness (mm)</label><input id="thick" inputmode="decimal" value="0.50" oninput="calc()"></div><section class="result"><div class="rl">FEET REMAINING ON ROLL</div><div id="feet">327 FT</div></section><div class="note">All measurements are metric — result is shown in feet.</div></main></body></html>
